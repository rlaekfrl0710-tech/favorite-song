<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My 노래방</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://static.thenounproject.com/png/music-app-icon-2849414-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body onload="startAuth()" class="auth-locked">
    <section id="authGate" aria-labelledby="authTitle"><form id="authForm" onsubmit="submitAuth(event)"><p class="auth-eyebrow">MY KARAOKE</p><h1 id="authTitle">My 노래방</h1><p id="authDescription">로그인 상태를 확인하고 있어요.</p><input id="authPassword" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" required minlength="6" maxlength="128" hidden><button id="authSubmit" type="submit" hidden>로그인</button><p id="authMessage" role="status"></p></form></section>

    <div id="toast" role="status" aria-live="polite"></div>

    <section id="tab-home" class="tab-content active">
        <header class="header-section">
            <div class="header-main">
                <h1 class="header-title">My 노래방</h1>
                <button id="main-edit-toggle" onclick="toggleEditMode()" class="edit-btn">편집</button>
            </div>
            <div class="addon-section">
                <div class="search-box">
                    <i class="fas fa-search text-gray-400 mr-2"></i>
                    <input type="text" id="searchInput" oninput="renderList()" placeholder="제목, 가수, 발음 검색" class="bg-transparent border-none outline-none w-full">
                </div>
                <div class="category-scroll">
                    <button onclick="setFilter('FAV')" id="pill-FAV" class="filter-pill"><i class="fas fa-heart text-[var(--ios-heart)]"></i></button>
                    <button onclick="setFilter('ALL')" id="pill-ALL" class="filter-pill active">전체</button>
                    <button onclick="setFilter('J-POP')" id="pill-J-POP" class="filter-pill">J-POP</button>
                    <button onclick="setFilter('K-POP')" id="pill-K-POP" class="filter-pill">K-POP</button>
                    <button onclick="setFilter('ETC')" id="pill-ETC" class="filter-pill">기타</button>
                </div>
            </div>
        </header>
        <div class="scroll-body" id="mainList"></div>
    </section>

    <section id="tab-add" class="tab-content">
        <header class="header-section">
            <div class="header-main"><h1 id="add-page-title" class="header-title">곡 추가</h1></div>
        </header>
        <div class="scroll-body">
            <div class="genre-control" aria-label="곡 분류">
                <button onclick="setFormGenre('J-POP')" id="btnJ" class="flex-1 py-3 rounded-xl text-xs font-bold bg-white shadow-sm">J-POP</button>
                <button onclick="setFormGenre('K-POP')" id="btnK" class="flex-1 py-3 rounded-xl text-xs font-bold text-gray-400">K-POP</button>
                <button onclick="setFormGenre('ETC')" id="btnE" class="flex-1 py-3 rounded-xl text-xs font-bold text-gray-400">기타</button>
            </div>
            
            <input type="hidden" id="editingId">
            <label class="form-field" for="inTitle"><span>제목 <span class="field-required">필수</span></span><input type="text" id="inTitle" class="ios-input" placeholder="제목"></label>
            <label class="form-field" for="inSubTitle"><span>발음 또는 부제</span><input type="text" id="inSubTitle" class="ios-input" placeholder="발음 또는 부제"></label>
            <label class="form-field" for="inArtist"><span>가수 <span class="field-required">필수</span></span><input type="text" id="inArtist" class="ios-input" placeholder="가수명"></label>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <label class="form-field" for="inTJ"><span>TJ 번호</span><input type="text" id="inTJ" class="ios-input" placeholder="TJ 번호" inputmode="numeric"></label>
                <label class="form-field" for="inKY"><span>KY 번호</span><input type="text" id="inKY" class="ios-input" placeholder="KY 번호" inputmode="numeric"></label>
            </div>

            <div class="lyrics-label">가사 <span>선택</span></div><div class="pro-toolbar" role="toolbar" aria-label="가사 서식">
                <button onpointerdown="event.preventDefault()" data-format="bold" aria-pressed="false" onclick="execCmd('bold')" class="tool-btn" type="button" aria-label="굵게"><i class="fas fa-bold"></i></button>
                <button onpointerdown="event.preventDefault()" data-format="foreColor" aria-pressed="false" onclick="execCmd('foreColor', '#FF8787')" class="tool-btn" type="button" aria-label="글자색"><div class="w-5 h-5 rounded bg-[#FF8787]"></div></button>
                <button onpointerdown="event.preventDefault()" data-format="hiliteColor" aria-pressed="false" onclick="execCmd('hiliteColor', '#FEF08A')" class="tool-btn" type="button" aria-label="형광펜"><i class="fas fa-highlighter text-[#EAB308]"></i></button>
                <button onpointerdown="event.preventDefault()" onclick="execCmd('removeFormat')" class="tool-btn" type="button" aria-label="서식 지우기"><i class="fas fa-eraser"></i></button>
            </div>

            <div id="lyricsEditor" contenteditable="true" role="textbox" aria-label="가사" aria-multiline="true" data-placeholder="가사를 입력하거나 붙여넣으세요"></div>
            <p id="songFormMessage" class="form-message" role="status"></p><button type="button" onclick="saveSong()" id="saveBtn" class="w-full py-5 bg-[#1C1E21] text-white rounded-3xl font-bold text-xl mt-6">저장하기</button>
            <button id="cancelEditBtn" onclick="resetAllStates(); switchTab('home', document.querySelectorAll('.nav-item')[0]);" class="hidden w-full py-4 text-gray-400 mt-2 font-bold">취소</button>
        </div>
    </section>

    <section id="tab-more" class="tab-content">
        <header class="header-section">
            <div class="header-main"><h1 class="header-title">설정</h1></div>
        </header>
        <div class="scroll-body settings-body">
            <div class="settings-group" aria-label="백업 및 복원">
                <button type="button" onclick="exportData()" class="settings-row"><i class="fas fa-arrow-down" aria-hidden="true"></i><span>데이터 백업</span><i class="fas fa-chevron-right row-chevron" aria-hidden="true"></i></button>
                <label class="settings-row upload-row"><i class="fas fa-arrow-up" aria-hidden="true"></i><span>데이터 복구</span><input type="file" accept=".json,application/json" onchange="importData(this)"><i class="fas fa-chevron-right row-chevron" aria-hidden="true"></i></label>
                <button type="button" onclick="restoreTrash()" class="settings-row"><i class="fas fa-trash-restore" aria-hidden="true"></i><span>휴지통 복원</span><i class="fas fa-chevron-right row-chevron" aria-hidden="true"></i></button>
            </div>
            <div class="settings-group sync-group"><div class="sync-summary"><i class="fas fa-cloud" aria-hidden="true"></i><p id="cloudStatus" role="status">이 기기에 저장됨</p></div><button type="button" onclick="initializeCloud()" class="settings-row"><i class="fas fa-rotate" aria-hidden="true"></i><span>동기화 다시 시도</span><i class="fas fa-chevron-right row-chevron" aria-hidden="true"></i></button></div>
            <div class="settings-group"><button type="button" onclick="logoutApp()" class="settings-row"><i class="fas fa-arrow-right-from-bracket" aria-hidden="true"></i><span>로그아웃</span><i class="fas fa-chevron-right row-chevron" aria-hidden="true"></i></button><button type="button" onclick="clearData()" class="settings-row danger-row"><i class="fas fa-trash-alt" aria-hidden="true"></i><span>모든 곡 휴지통으로 이동</span><i class="fas fa-chevron-right row-chevron" aria-hidden="true"></i></button></div>
            <p class="settings-version">My 노래방 · 10.3</p>
        </div>
    </section>

    <nav id="bottom-nav" class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><i class="fas fa-house"></i></div>
        <div class="nav-item" onclick="switchTab('add', this)"><i class="fas fa-plus"></i></div>
        <div class="nav-item" onclick="switchTab('more', this)"><i class="fas fa-gear"></i></div>
    </nav>

    <div id="sheetBackdrop" onclick="closeLyrics()" hidden></div>
<div id="deleteBar" hidden><span id="selectionCount"></span><button type="button" onclick="deleteSelected()">선택 삭제</button></div>
<div id="lyricPopup" class="slide-up flex flex-col" role="dialog" aria-modal="true" aria-labelledby="popTitle" aria-hidden="true" inert>
        <div id="sheetHandle" aria-label="아래로 끌어 닫기"><span></span></div>
        <header class="px-8 py-2 flex justify-between items-center shrink-0">
            <div class="flex-1 overflow-hidden">
                <h3 id="popTitle" class="font-bold text-2xl truncate"></h3>
                <p id="popArtist" class="text-sm text-gray-400 mt-1"></p>
            </div>
            <div class="flex items-center gap-5">
                <button onclick="closeLyrics()" aria-label="가사 닫기" class="sheet-close">×</button><button onclick="copyAndSelectAll()" title="전체 복사" class="text-gray-400 text-xl active:text-black"><i class="fas fa-copy"></i></button>
                <button id="popEditBtn" class="text-gray-400 text-xl"><i class="fas fa-pen"></i></button>
                <button id="popFavBtn" class="text-2xl"><i class="fas fa-heart"></i></button>
            </div>
        </header>
        <div id="popContent" class="flex-1 overflow-y-auto px-8 py-6"></div>
        <div class="px-8 py-6 bg-gray-50 flex gap-4 pb-24 shrink-0">
            <div class="flex-1 text-center"><span class="num-label">TJ</span><span id="popTJ" class="num-val"></span></div>
            <div class="flex-1 text-center border-l"><span class="num-label">KY</span><span id="popKY" class="num-val"></span></div>
        </div>
    </div>

    <script src="/app.js?v=20261023-paste2"></script>
</body>
</html>

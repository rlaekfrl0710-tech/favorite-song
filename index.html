<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My 노래방</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://static.thenounproject.com/png/music-app-icon-2849414-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;700&display=swap');
        
        :root {
            --ios-bg: #FFFFFF;
            --ios-header-bg: rgba(255, 255, 255, 0.96);
            --cool-gray-bg: #F2F4F7;
            --cool-gray-dark: #E5E8EB;
            --ios-text: #1C1E21;
            --ios-subtext: #8E96A3;
            --ios-heart: #FF8787;
            --side-padding: 24px;
        }

        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: var(--ios-bg); color: var(--ios-text); letter-spacing: -0.03em; -webkit-tap-highlight-color: transparent; margin: 0; overflow: hidden; }

        .tab-content { display: none; flex-direction: column; height: 100vh; }
        .tab-content.active { display: flex; }

        /* 헤더 */
        .header-section { flex-shrink: 0; background: var(--ios-header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--cool-gray-dark); padding-top: env(safe-area-inset-top); }
        .header-main { padding: 20px var(--side-padding) 10px; display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-size: 28px; font-weight: 800; }
        .edit-btn { color: #007AFF; font-weight: 600; font-size: 16px; }

        .scroll-body { flex: 1; overflow-y: auto; padding: 20px var(--side-padding) 140px; }

        /* 검색 & 필터 */
        .search-box { background: var(--cool-gray-bg); border-radius: 12px; padding: 10px 16px; display: flex; align-items: center; margin: 0 var(--side-padding) 12px; }
        .category-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 0 var(--side-padding) 15px; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .filter-pill { flex: 0 0 65px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 16px; font-size: 13px; font-weight: 600; background: var(--cool-gray-bg); color: var(--ios-subtext); }
        .filter-pill.active { background: var(--ios-text); color: #fff; }

        /* 카드 */
        .song-card-wrapper { display: flex; align-items: center; gap: 0; margin-bottom: 12px; }
        .song-card { flex: 1; background: var(--cool-gray-bg); border-radius: 20px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .num-label { font-size: 10px; color: var(--ios-subtext); font-weight: 700; margin-right: 3px; }
        .num-val { font-size: 13px; color: #000; font-weight: 800; font-style: italic; }

        .delete-checkbox { width: 0; height: 24px; opacity: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; flex-shrink: 0; transition: all 0.25s ease; }
        .edit-mode .delete-checkbox { width: 40px; opacity: 1; margin-right: 8px; border: 2px solid var(--cool-gray-dark); border-radius: 50%; }
        .delete-checkbox.checked { background: #FF3B30; border-color: #FF3B30; color: white; }

        /* 꾸미기 툴바 */
        .pro-toolbar { display: flex; gap: 10px; margin-bottom: 12px; }
        .tool-btn { background: #fff; border: 1px solid var(--cool-gray-dark); border-radius: 10px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* 입력 폼 */
        .ios-input { background: var(--cool-gray-bg); border-radius: 14px; padding: 16px; width: 100%; outline: none; border: none; font-size: 16px; margin-bottom: 10px; }
        #lyricsEditor { min-height: 250px; background: var(--cool-gray-bg); border-radius: 18px; padding: 20px; outline: none; font-size: 14px !important; line-height: 1.6; color: var(--ios-text); }

        /* 팝업 가사 폰트 */
        #popContent { font-size: 14px !important; line-height: 1.7; -webkit-user-select: text; user-select: text; }

        /* 하단 내비 */
        .bottom-nav { position: fixed; bottom: 30px; left: 24px; right: 24px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-radius: 24px; display: flex; padding: 6px; z-index: 2000; box-shadow: 0 8px 30px rgba(0,0,0,0.11); border: 1px solid var(--cool-gray-dark); }
        .nav-item { flex: 1; padding: 12px 0; text-align: center; color: var(--ios-subtext); border-radius: 20px; font-size: 18px; }
        .nav-item.active { background: var(--ios-text); color: #fff; }

        /* 팝업 */
        .slide-up { position: fixed; inset: 0; background: #fff; z-index: 3000; transform: translate3d(0, 100%, 0); border-radius: 30px 30px 0 0; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .slide-up.active { transform: translate3d(0, 44px, 0); }
        
        #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 24px; border-radius: 24px; font-size: 14px; z-index: 4000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }

/* My 노래방: safe areas, touch gestures and restrained motion. */
*{box-sizing:border-box}
:root{--side-padding:20px}
.tab-content{height:100dvh;max-width:720px;margin:0 auto;min-height:0}
.header-main{padding-top:18px;padding-bottom:14px}
.header-title{font-size:28px;line-height:1.25;letter-spacing:-.04em}
.scroll-body{min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:16px;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.song-card-wrapper{position:relative;isolation:isolate;overflow:hidden;border-radius:18px;margin-bottom:10px}
.song-card{position:relative;z-index:1;min-width:0;width:100%;min-height:88px;border-radius:18px;padding:16px;transition:transform .24s cubic-bezier(.22,1,.36,1);touch-action:pan-y}
.swipe-delete{position:absolute;inset:0 0 0 auto;width:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#ff3b30;color:white;font:inherit;font-size:12px;border:0;cursor:pointer}
.swipe-open .song-card{transform:translateX(-82px)}
.edit-mode .delete-checkbox{width:26px;height:26px;min-width:26px;margin-right:12px;margin-left:2px}
.edit-mode .song-card{width:auto}
#deleteBar{position:fixed;z-index:2100;left:20px;right:20px;bottom:calc(94px + env(safe-area-inset-bottom));max-width:680px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border:1px solid #e5e5ea;border-radius:16px;box-shadow:0 6px 24px #0000000d;font-size:14px}
#deleteBar[hidden],#sheetBackdrop[hidden]{display:none}
#deleteBar button{background:#ff3b30;color:white;border-radius:10px;padding:9px 14px;font-weight:600}
#deleteBar button:disabled{opacity:.35;cursor:default}
.selecting #mainList{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
.bottom-nav{bottom:calc(12px + env(safe-area-inset-bottom));left:20px;right:20px;max-width:680px;margin:auto;border-radius:22px;box-shadow:0 5px 24px #0000000c}
.nav-item{cursor:pointer;transition:background-color .2s ease,color .2s ease}
#sheetBackdrop{position:fixed;inset:0;z-index:2900;background:#0005;animation:backdrop-in .2s ease}
.slide-up{inset:auto 0 0;max-width:720px;margin:auto;height:calc(100dvh - max(24px,env(safe-area-inset-top)));border-radius:26px 26px 0 0;transform:translate3d(0,105%,0);visibility:hidden;transition:transform .32s cubic-bezier(.22,1,.36,1),visibility .32s;overflow:hidden;box-shadow:0 -8px 40px #00000010}
.slide-up.active{transform:translate3d(0,0,0);visibility:visible}
#sheetHandle{height:28px;display:grid;place-items:center;flex:none;touch-action:none;cursor:grab}
#sheetHandle span{width:36px;height:5px;border-radius:99px;background:#d1d1d6}
#lyricPopup>header{padding:4px 20px 14px;gap:16px}
#lyricPopup>header>div:last-child{gap:12px}
#lyricPopup header button{min-width:30px;min-height:36px;display:grid;place-items:center;transition:opacity .15s ease}
.sheet-close{font-size:26px;line-height:1;color:#8e8e93}
#popTitle{font-size:22px;line-height:1.35}
#popContent{min-height:0;padding:20px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#lyricPopup>div:last-child{padding:16px 20px calc(20px + env(safe-area-inset-bottom))}
.ios-input{padding:15px 16px;line-height:1.5}
.cloud-retry{font-size:13px;color:#007aff;margin-top:8px}
#cloudStatus{font-size:13px;line-height:1.6;color:var(--ios-subtext)}
#saveBtn{font-size:17px;padding:17px;border-radius:16px}
@keyframes backdrop-in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.song-card,.slide-up,.nav-item{transition:none}#sheetBackdrop{animation:none}}
    </style>
</head>
<body onload="initApp()">

    <div id="toast">가사가 전체 선택 및 복사되었습니다!</div>

    <section id="tab-home" class="tab-content active">
        <header class="header-section">
            <div class="header-main">
                <h1 class="header-title">My 노래방</h1>
                <button id="main-edit-toggle" onclick="toggleEditMode()" class="edit-btn">편집</button>
            </div>
            <div class="addon-section">
                <div class="search-box">
                    <i class="fas fa-search text-gray-400 mr-2"></i>
                    <input type="text" id="searchInput" oninput="renderList()" placeholder="제목, 가수, 발음 검색" class="bg-transparent border-none outline-none w-full">
                </div>
                <div class="category-scroll">
                    <button onclick="setFilter('FAV')" id="pill-FAV" class="filter-pill"><i class="fas fa-heart text-[var(--ios-heart)]"></i></button>
                    <button onclick="setFilter('ALL')" id="pill-ALL" class="filter-pill active">전체</button>
                    <button onclick="setFilter('J-POP')" id="pill-J-POP" class="filter-pill">J-POP</button>
                    <button onclick="setFilter('K-POP')" id="pill-K-POP" class="filter-pill">K-POP</button>
                    <button onclick="setFilter('ETC')" id="pill-ETC" class="filter-pill">기타</button>
                </div>
            </div>
        </header>
        <div class="scroll-body" id="mainList"></div>
    </section>

    <section id="tab-add" class="tab-content">
        <header class="header-section">
            <div class="header-main"><h1 id="add-page-title" class="header-title">곡 추가</h1></div>
        </header>
        <div class="scroll-body">
            <div class="flex p-1 bg-[#F0F2F5] rounded-2xl mb-6">
                <button onclick="setFormGenre('J-POP')" id="btnJ" class="flex-1 py-3 rounded-xl text-xs font-bold bg-white shadow-sm">J-POP</button>
                <button onclick="setFormGenre('K-POP')" id="btnK" class="flex-1 py-3 rounded-xl text-xs font-bold text-gray-400">K-POP</button>
                <button onclick="setFormGenre('ETC')" id="btnE" class="flex-1 py-3 rounded-xl text-xs font-bold text-gray-400">기타</button>
            </div>
            
            <input type="hidden" id="editingId">
            <input type="text" id="inTitle" class="ios-input" placeholder="제목">
            <input type="text" id="inSubTitle" class="ios-input" placeholder="발음 또는 부제">
            <input type="text" id="inArtist" class="ios-input" placeholder="가수명">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <input type="text" id="inTJ" class="ios-input" placeholder="TJ 번호">
                <input type="text" id="inKY" class="ios-input" placeholder="KY 번호">
            </div>

            <div class="pro-toolbar">
                <button onmousedown="event.preventDefault(); execCmd('bold')" class="tool-btn"><i class="fas fa-bold"></i></button>
                <button onmousedown="event.preventDefault(); execCmd('foreColor', '#FF8787')" class="tool-btn"><div class="w-5 h-5 rounded bg-[#FF8787]"></div></button>
                <button onmousedown="event.preventDefault(); execCmd('hiliteColor', '#FEF08A')" class="tool-btn"><i class="fas fa-highlighter text-[#EAB308]"></i></button>
                <button onmousedown="event.preventDefault(); execCmd('removeFormat')" class="tool-btn"><i class="fas fa-eraser"></i></button>
            </div>

            <div id="lyricsEditor" contenteditable="true" placeholder="가사를 입력하세요..."></div>
            <button onclick="saveSong()" id="saveBtn" class="w-full py-5 bg-[#1C1E21] text-white rounded-3xl font-bold text-xl mt-6">저장하기</button>
            <button id="cancelEditBtn" onclick="resetAllStates(); switchTab('home', document.querySelectorAll('.nav-item')[0]);" class="hidden w-full py-4 text-gray-400 mt-2 font-bold">취소</button>
        </div>
    </section>

    <section id="tab-more" class="tab-content">
        <header class="header-section">
            <div class="header-main"><h1 class="header-title">설정</h1></div>
        </header>
        <div class="scroll-body space-y-3">
            <div onclick="exportData()" class="ios-input flex justify-between items-center cursor-pointer"><span>데이터 백업</span><i class="fas fa-download text-blue-400"></i></div>
            <label class="ios-input flex justify-between items-center cursor-pointer"><span>데이터 복구</span><input type="file" onchange="importData(this)" class="hidden"><i class="fas fa-upload text-blue-400"></i></label>
            <button type="button" onclick="restoreTrash()" class="ios-input">휴지통 복원</button>
            <div onclick="clearData()" class="ios-input flex justify-between items-center text-red-400 cursor-pointer"><span>모든 데이터 초기화</span><i class="fas fa-trash-alt"></i></div>
            <div class="ios-input"><p id="cloudStatus" role="status">이 기기에 저장됨</p><button type="button" onclick="initializeCloud()" class="cloud-retry">동기화 다시 시도</button></div>
            <div class="pt-20 text-center opacity-20 text-[10px] font-bold uppercase tracking-widest">v10.2 Final Integrity</div>
        </div>
    </section>

    <nav id="bottom-nav" class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><i class="fas fa-house"></i></div>
        <div class="nav-item" onclick="switchTab('add', this)"><i class="fas fa-plus"></i></div>
        <div class="nav-item" onclick="switchTab('more', this)"><i class="fas fa-gear"></i></div>
    </nav>

    <div id="sheetBackdrop" onclick="closeLyrics()" hidden></div>
<div id="deleteBar" hidden><span id="selectionCount"></span><button type="button" onclick="deleteSelected()">선택 삭제</button></div>
<div id="lyricPopup" class="slide-up flex flex-col" role="dialog" aria-modal="true" aria-labelledby="popTitle" aria-hidden="true" inert>
        <div id="sheetHandle" aria-label="아래로 끌어 닫기"><span></span></div>
        <header class="px-8 py-2 flex justify-between items-center shrink-0">
            <div class="flex-1 overflow-hidden">
                <h3 id="popTitle" class="font-bold text-2xl truncate"></h3>
                <p id="popArtist" class="text-sm text-gray-400 mt-1"></p>
            </div>
            <div class="flex items-center gap-5">
                <button onclick="closeLyrics()" aria-label="가사 닫기" class="sheet-close">×</button><button onclick="copyAndSelectAll()" title="전체 복사" class="text-gray-400 text-xl active:text-black"><i class="fas fa-copy"></i></button>
                <button id="popEditBtn" class="text-gray-400 text-xl"><i class="fas fa-pen"></i></button>
                <button id="popFavBtn" class="text-2xl"><i class="fas fa-heart"></i></button>
            </div>
        </header>
        <div id="popContent" class="flex-1 overflow-y-auto px-8 py-6"></div>
        <div class="px-8 py-6 bg-gray-50 flex gap-4 pb-24 shrink-0">
            <div class="flex-1 text-center"><span class="num-label">TJ</span><span id="popTJ" class="num-val"></span></div>
            <div class="flex-1 text-center border-l"><span class="num-label">KY</span><span id="popKY" class="num-val"></span></div>
        </div>
    </div>

    <script>
        let songs = [];
        let currentFilter = 'ALL';
        let formGenre = 'J-POP';
        let isEditMode = false;
        let selectedIds = new Set();

        function initApp() {
            try { songs = JSON.parse(localStorage.getItem('karaoke_v5_data')) || []; if(!Array.isArray(songs)) songs=[]; } catch(e) { songs=[]; notify('저장된 데이터 확인이 필요해요. 백업 파일을 보관해 주세요.'); }
            renderList();
            initializeCloud();
            
            // 서식 없는 붙여넣기 강제
            document.getElementById('lyricsEditor').addEventListener('paste', (e) => {
                e.preventDefault();
                const text = (e.originalEvent || e).clipboardData.getData('text/plain');
                document.execCommand('insertText', false, text);
            });
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(tabId !== 'add' || !document.getElementById('editingId').value) resetAllStates();
            document.getElementById('tab-' + tabId).classList.add('active');
            el.classList.add('active');
            if(tabId === 'home') renderList();
            window.scrollTo(0,0);
        }

        function resetAllStates() {
            document.getElementById('searchInput').value = '';
            currentFilter = 'ALL';
            document.querySelectorAll('.filter-pill').forEach(btn=>btn.classList.toggle('active',btn.id==='pill-ALL'));
            if(isEditMode) toggleEditMode();
            document.getElementById('editingId').value = '';
            document.querySelectorAll('#tab-add input[type="text"]').forEach(i => i.value = '');
            document.getElementById('lyricsEditor').innerHTML = '';
            document.getElementById('add-page-title').innerText = "곡 추가";
            document.getElementById('saveBtn').innerText = "저장하기";
            document.getElementById('cancelEditBtn').classList.add('hidden');
            setFormGenre('J-POP');
            closeLyrics();
        }

        function renderList() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('mainList');
            const filtered = songs.filter(s => {
                const match = String(s.title||'').toLowerCase().includes(query) || String(s.artist||'').toLowerCase().includes(query) || (s.sub && s.sub.toLowerCase().includes(query));
                if(currentFilter === 'ALL') return match;
                if(currentFilter === 'FAV') return match && s.fav;
                return match && s.genre === currentFilter;
            });
            container.innerHTML = filtered.length ? '' : '<div class="text-center py-20 opacity-20 font-bold italic">결과가 없습니다.</div>';
            updateDeleteBar();
            filtered.forEach(s => {
                const wrapper = document.createElement('div');
                wrapper.dataset.songId = String(s.id);
                wrapper.className = 'song-card-wrapper' + (isEditMode ? ' edit-mode' : '');
                wrapper.innerHTML = `<button type="button" class="swipe-delete" aria-label="곡 삭제" onclick="event.stopPropagation(); deleteSongs([${s.id}])"><i class="fas fa-trash-alt"></i><span>삭제</span></button><div class="delete-checkbox ${selectedIds.has(s.id)?'checked':''}" onclick="handleCardClick(${s.id})">${selectedIds.has(s.id)?'<i class="fas fa-check"></i>':''}</div><div class="song-card" onclick="handleCardClick(${s.id})"><div class="flex-1 overflow-hidden pr-4"><div class="flex items-center gap-1.5">${s.fav?'<i class="fas fa-heart text-[var(--ios-heart)] text-[10px]"></i>':''}<h4 class="font-bold text-lg truncate">${escapeText(s.title)}</h4></div><p class="text-xs text-gray-400 mt-1 truncate">${escapeText(s.artist)} ${s.sub?'• '+escapeText(s.sub):''}</p></div><div class="shrink-0 text-right"><div><span class="num-label">TJ</span><span class="num-val">${escapeText(s.tj)}</span></div><div><span class="num-label">KY</span><span class="num-val">${escapeText(s.ky)}</span></div></div></div>`;
                container.appendChild(wrapper);
                bindSwipe(wrapper);
            });
        }

        function showLyrics(id) {
            const song = songs.find(s => s.id === id); if(!song) return;
            document.getElementById('popTitle').innerText = song.title;
            document.getElementById('popArtist').innerText = `${song.artist} • ${song.genre}`;
            document.getElementById('popTJ').innerText = song.tj;
            document.getElementById('popKY').innerText = song.ky;
            document.getElementById('popContent').innerHTML = song.lyrics || '가사가 없습니다.';
            const fBtn = document.getElementById('popFavBtn');
            fBtn.style.color = song.fav ? '#FF8787' : '#E5E5EA';
            fBtn.onclick = () => { song.fav = !song.fav; persistSongs(); showLyrics(id); renderList(); };
            document.getElementById('popEditBtn').onclick = () => {
                closeLyrics();
                switchTab('add', document.querySelectorAll('.nav-item')[1]);
                document.getElementById('editingId').value = song.id;
                document.getElementById('inTitle').value = song.title;
                document.getElementById('inSubTitle').value = song.sub || '';
                document.getElementById('inArtist').value = song.artist;
                document.getElementById('inTJ').value = song.tj;
                document.getElementById('inKY').value = song.ky;
                document.getElementById('lyricsEditor').innerHTML = song.lyrics;
                document.getElementById('add-page-title').innerText = "곡 수정";
                document.getElementById('saveBtn').innerText = "수정 완료";
                document.getElementById('cancelEditBtn').classList.remove('hidden');
                setFormGenre(song.genre);
            };
            openLyrics();
        }

        // 아이폰 최적화: 전체 선택 + 복사 + 알림 통합 함수
        async function copyAndSelectAll() {
            const content = document.getElementById('popContent');
            // 1. 전체 선택 시각화
            const range = document.createRange();
            range.selectNodeContents(content);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            // 2. 복사 실행
            try {
                await navigator.clipboard.writeText(content.innerText);
            } catch (e) {
                document.execCommand('copy'); // 구형 대응
            }
            // 3. 토스트 알림
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        function saveSong() {
            const title = document.getElementById('inTitle').value.trim();
            const artist = document.getElementById('inArtist').value.trim();
            if(!title || !artist) return alert('제목과 가수는 필수입니다.');
            const editId = document.getElementById('editingId').value;
            const data = {
                id: editId ? parseInt(editId) : Date.now(),
                genre: formGenre, title, sub: document.getElementById('inSubTitle').value,
                artist, tj: document.getElementById('inTJ').value || '-', ky: document.getElementById('inKY').value || '-',
                lyrics: document.getElementById('lyricsEditor').innerHTML,
                fav: editId ? songs.find(s => s.id === parseInt(editId)).fav : false
            };
            if(editId) songs[songs.findIndex(s => s.id === data.id)] = data;
            else songs.unshift(data);
            persistSongs();
            resetAllStates();
            switchTab('home', document.querySelectorAll('.nav-item')[0]);
        }

        function setFormGenre(g) {
            formGenre = g;
            ['btnJ', 'btnK', 'btnE'].forEach(id => document.getElementById(id).className = 'flex-1 py-3 rounded-xl text-xs font-bold text-gray-400');
            const target = g === 'J-POP' ? 'btnJ' : (g === 'K-POP' ? 'btnK' : 'btnE');
            document.getElementById(target).className = 'flex-1 py-3 rounded-xl text-xs font-bold bg-white shadow-sm';
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.toggle('active', btn.id === 'pill-'+f));
            renderList();
        }

        function toggleEditMode() { isEditMode = !isEditMode; selectedIds.clear(); document.getElementById('main-edit-toggle').innerText = isEditMode ? "취소" : "편집"; renderList(); }
        function handleCardClick(id) { if(Date.now()<suppressCardUntil)return; const opened=document.querySelector('.swipe-open');if(opened){opened.classList.remove('swipe-open');return;} if(isEditMode) { if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id); renderList(); } else showLyrics(id); }
        function execCmd(c,v=null) { document.getElementById('lyricsEditor').focus(); document.execCommand(c, false, v); }
        function exportData() { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(songs)],{type:'application/json'})); a.download='karaoke_backup.json'; a.click(); }
        function importData(i) { if(!i.files[0])return;const r=new FileReader();r.onload=e=>{try{const data=JSON.parse(e.target.result);if(!Array.isArray(data)||data.some(s=>!s||!Number.isFinite(s.id)||typeof s.title!=='string'||typeof s.artist!=='string'))throw Error();songs=data;persistSongs();renderList();notify('백업을 불러왔어요');}catch(err){notify('올바른 노래방 백업 파일이 아니에요');}i.value='';};r.readAsText(i.files[0]); }
        function clearData() { if(confirm('모든 곡을 휴지통으로 옮길까요?')) deleteSongs(songs.map(s=>s.id)); }
        

        let suppressCardUntil=0, sheetReturnFocus=null, cloudReady=false, cloudBusy=false, cloudAgain=false, cloudVersions={}, cloudBaseline={}, cloudTimer;
        let cloudMeta={};try{cloudMeta=JSON.parse(localStorage.getItem('karaoke_cloud_meta')||'{}');}catch(e){}
        cloudVersions=cloudMeta.versions||{};cloudBaseline=cloudMeta.baseline||{};
        const cloudPending=new Set(cloudMeta.pending||[]);
        function persistCloudMeta(){localStorage.setItem('karaoke_cloud_meta',JSON.stringify({versions:cloudVersions,baseline:cloudBaseline,pending:[...cloudPending]}));}
        function escapeText(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
        function notify(message){const el=document.getElementById('toast');el.textContent=message;el.style.opacity='1';clearTimeout(el._timer);el._timer=setTimeout(()=>el.style.opacity='0',2200);}
        function updateDeleteBar(){const bar=document.getElementById('deleteBar');bar.hidden=!isEditMode;document.body.classList.toggle('selecting',isEditMode);document.getElementById('selectionCount').textContent=selectedIds.size+'곡 선택';bar.querySelector('button').disabled=!selectedIds.size;}
        function deleteSelected(){deleteSongs([...selectedIds]);}
        function deleteSongs(ids){const removed=songs.filter(s=>ids.includes(s.id));if(!removed.length)return;let trash=[];try{trash=JSON.parse(localStorage.getItem('karaoke_v5_trash')||'[]');}catch(e){}trash.push(...removed.map(song=>({song,deletedAt:Date.now()})));try{localStorage.setItem('karaoke_v5_trash',JSON.stringify(trash));}catch(e){notify('휴지통을 저장하지 못해 삭제를 중단했어요');return;}songs=songs.filter(s=>!ids.includes(s.id));ids.forEach(id=>cloudPending.add(String(id)));selectedIds.clear();persistSongs();closeLyrics();renderList();notify(removed.length+'곡을 휴지통으로 옮겼어요');}
        function restoreTrash(){let trash=[];try{trash=JSON.parse(localStorage.getItem('karaoke_v5_trash')||'[]');}catch(e){}if(!trash.length){notify('휴지통이 비어 있어요');return;}trash.forEach(item=>{if(!songs.some(s=>s.id===item.song.id)){songs.unshift(item.song);cloudPending.add(String(item.song.id));}});persistSongs();localStorage.removeItem('karaoke_v5_trash');renderList();notify('휴지통의 곡을 복원했어요');}
        function persistSongs(){try{localStorage.setItem('karaoke_v5_data',JSON.stringify(songs));}catch(e){notify('기기 저장 공간을 확인해 주세요');return;}{const current=new Map(songs.map(s=>[String(s.id),JSON.stringify(s)]));current.forEach((value,id)=>{if(cloudBaseline[id]!==value)cloudPending.add(id);});Object.keys(cloudBaseline).forEach(id=>{if(!current.has(id))cloudPending.add(id);});persistCloudMeta();if(cloudReady){clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,450);}}}
        function openLyrics(){const popup=document.getElementById('lyricPopup');if(!popup.classList.contains('active'))sheetReturnFocus=document.activeElement;popup.inert=false;popup.setAttribute('aria-hidden','false');document.getElementById('sheetBackdrop').hidden=false;popup.classList.add('active');document.querySelector('.sheet-close').focus({preventScroll:true});}
        function closeLyrics(){const popup=document.getElementById('lyricPopup');popup.classList.remove('active');popup.style.removeProperty('transform');popup.inert=true;popup.setAttribute('aria-hidden','true');document.getElementById('sheetBackdrop').hidden=true;if(sheetReturnFocus&&sheetReturnFocus.isConnected)sheetReturnFocus.focus({preventScroll:true});}
        function bindSwipe(wrapper){const card=wrapper.querySelector('.song-card');let drag=null;card.addEventListener('pointerdown',e=>{if(isEditMode||e.button!==0)return;drag={x:e.clientX,y:e.clientY,offset:wrapper.classList.contains('swipe-open')?-82:0,locked:false};});card.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.locked&&Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){drag=null;return;}if(!drag.locked&&Math.abs(dx)>10){drag.locked=true;card.setPointerCapture(e.pointerId);document.querySelectorAll('.swipe-open').forEach(row=>{if(row!==wrapper)row.classList.remove('swipe-open');});card.style.transition='none';}if(drag.locked){e.preventDefault();card.style.transform='translateX('+Math.min(0,Math.max(-96,drag.offset+dx))+'px)';}});function finish(e){if(!drag)return;if(drag.locked){wrapper.classList.toggle('swipe-open',drag.offset+e.clientX-drag.x < -35);suppressCardUntil=Date.now()+350;}card.style.removeProperty('transition');card.style.removeProperty('transform');drag=null;}card.addEventListener('pointerup',finish);card.addEventListener('pointercancel',()=>{card.style.removeProperty('transition');card.style.removeProperty('transform');drag=null;});}
        const sheetHandle=document.getElementById('sheetHandle');let sheetDrag=null;sheetHandle.addEventListener('pointerdown',e=>{sheetDrag={y:e.clientY};sheetHandle.setPointerCapture(e.pointerId);});sheetHandle.addEventListener('pointermove',e=>{if(!sheetDrag)return;const delta=Math.max(0,e.clientY-sheetDrag.y);document.getElementById('lyricPopup').style.transform='translateY('+delta+'px)';});function finishSheet(e){if(!sheetDrag)return;const down=e.clientY-sheetDrag.y;sheetDrag=null;document.getElementById('lyricPopup').style.removeProperty('transform');if(down>85)closeLyrics();}sheetHandle.addEventListener('pointerup',finishSheet);sheetHandle.addEventListener('pointercancel',()=>{sheetDrag=null;document.getElementById('lyricPopup').style.removeProperty('transform');});
        document.addEventListener('keydown',e=>{const popup=document.getElementById('lyricPopup');if(!popup.classList.contains('active'))return;if(e.key==='Escape')closeLyrics();if(e.key==='Tab'){const buttons=[...popup.querySelectorAll('button')],first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
        function cloudMessage(text){document.getElementById('cloudStatus').textContent=text;}
        function cloudCall(name,payload){return new Promise((resolve,reject)=>{const run=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(name==='read')run.karaokeRead();else run.karaokeWrite(payload);});}
        async function initializeCloud(){if(!(window.google&&google.script&&google.script.run)){cloudMessage('이 기기에 저장됨 · Google 동기화 앱에서 연결 가능');return;}if(cloudBusy)return;cloudBusy=true;cloudMessage('Google 데이터 연결 중…');try{const data=await cloudCall('read'),remote=data.records||{};const previousBaseline=cloudBaseline;const local=new Map(songs.map(s=>[String(s.id),s]));Object.keys(remote).forEach(id=>{const record=remote[id];cloudVersions[id]=record.version;if(!cloudPending.has(id)){if(record.deleted){local.delete(id);delete cloudBaseline[id];}else{local.set(id,record.song);cloudBaseline[id]=JSON.stringify(record.song);}}});songs=[...local.values()];cloudReady=true;persistCloudMeta();persistSongs();renderList();cloudMessage('Google 데이터 연결 완료');}catch(e){cloudMessage('연결 실패 · 기기 기록은 유지됩니다');}finally{cloudBusy=false;}if(cloudReady)flushCloud();}
        async function flushCloud(){if(!cloudReady||cloudBusy){cloudAgain=true;return;}if(!cloudPending.size)return;cloudBusy=true;const ids=[...cloudPending],changes={};ids.forEach(id=>{const song=songs.find(s=>String(s.id)===id);changes[id]={version:cloudVersions[id]||0,song:song||null,deleted:!song};cloudPending.delete(id);});cloudMessage('Google에 저장 중…');try{const result=await cloudCall('write',{changes});Object.keys(result.records||{}).forEach(id=>{const r=result.records[id];cloudVersions[id]=r.version;if(!cloudPending.has(id)){songs=songs.filter(s=>String(s.id)!==id);if(!r.deleted)songs.push(r.song);if(r.deleted)delete cloudBaseline[id];else cloudBaseline[id]=JSON.stringify(r.song);}});localStorage.setItem('karaoke_v5_data',JSON.stringify(songs));persistCloudMeta();renderList();cloudMessage(result.conflict?'다른 기기의 최신 변경을 반영했어요':'Google 저장 완료');}catch(e){ids.forEach(id=>cloudPending.add(id));persistCloudMeta();cloudMessage('저장 실패 · 기기 기록 보존 · 다시 시도해 주세요');}finally{cloudBusy=false;}if(cloudAgain){cloudAgain=false;flushCloud();}}
        document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudReady&&!cloudBusy&&!cloudPending.size)initializeCloud();});
    </script>
</body>
</html>

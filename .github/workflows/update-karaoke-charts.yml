name: Update karaoke charts (every ~3 days)
on:
  schedule:
    - cron: '17 3 */3 * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-karaoke-charts.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chart-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch all 3 charts
        run: node scripts/update-charts.cjs
      - name: Commit only changed chart data
        run: |
          if git diff --quiet -- data/chart-data.json; then
            echo "No chart changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chart-data.json
          git commit -m "chore: refresh TJ karaoke chart data"
          git push
